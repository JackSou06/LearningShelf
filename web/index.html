<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>學習工具</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="app.css?v=0.1.7"></head><body>
<section id="home" class="home"><header><h1>課程</h1><div><button id="open-folder" class="secondary">開啟資料夾</button><button id="authoring" class="plain">製作課程</button></div></header><input id="course-search" type="search" placeholder="搜尋課程" aria-label="搜尋課程"><div id="course-list"></div><input id="folder-picker" type="file" webkitdirectory multiple hidden></section>
<div id="reader" class="shell" hidden><div class="backdrop" id="backdrop"></div><aside class="sidebar" id="sidebar" aria-label="章節目錄"><div class="sidebar-heading"><strong id="toc-title"></strong></div><label class="search"><input id="search" type="search" placeholder="搜尋主題" aria-label="搜尋主題"></label><div class="scope-tabs" id="scope-tabs" hidden></div><div class="study-progress"><div class="progress-top"><span>已瀏覽</span><span id="seen-label"></span></div><div class="progress-track"><span id="seen-bar"></span></div><div class="score-label" id="score-label"></div></div><button class="review-filter" id="review-filter" aria-pressed="false">☆ 待複習 <span id="review-count"></span></button><nav id="toc" aria-label="主題目錄"></nav></aside>
<header class="topbar"><div class="breadcrumb"><button id="home-button" class="plain">課程</button><button id="menu-toggle" class="icon-button" aria-label="開啟目錄" aria-expanded="false">☰</button><span id="course-title"></span></div><div class="top-actions"><button id="page-options" class="plain">筆記與來源</button><button id="record-open" class="plain">紀錄</button><button id="font-size" class="plain" aria-label="切換字級">Aa</button><span id="save-status" class="saved" role="status">已保存</span></div></header>
<main><div class="reader-area"><div id="book-viewport" role="region" aria-label="電子書閱讀區"><article id="lesson" tabindex="-1"></article></div><div id="empty" hidden><p>沒有符合的主題。</p><button id="clear-filter" class="secondary">清除篩選</button></div></div><section class="qa-panel" aria-label="對話 Q&A"><div class="qa-heading"><button id="qa-toggle" class="plain" aria-expanded="true">Q&A</button><div><button id="api-open" class="plain">API 設定</button><button id="context-open" class="plain">傳送內容</button></div></div><div id="qa-body"><div id="qa-thread" class="qa-thread"></div></div></section></main>
<footer class="page-nav"><button id="prev" aria-label="上一頁">← 上一頁</button><span id="page-position"></span><button id="next" aria-label="下一頁">下一頁 →</button></footer></div>
<dialog id="page-details"><div class="dialog-head"><h2>筆記與來源</h2><button class="icon-button" data-close="page-details" aria-label="關閉">×</button></div><div class="page-tools"><button id="bookmark" class="secondary">☆ 待複習</button><button id="page-link" class="plain">複製連結</button></div><label class="note-label">本主題筆記<textarea id="note" aria-label="本主題筆記" maxlength="200000"></textarea></label><div id="source-list"></div></dialog>
<dialog id="api-settings"><div class="dialog-head"><h2>API 設定</h2><button class="icon-button" data-close="api-settings" aria-label="關閉">×</button></div><form id="api-form"><label class="qa-field">API key<input id="api-key" type="password" autocomplete="off" spellcheck="false"></label><label class="qa-field">模型<input id="api-model" value="gpt-6.1-sol" autocomplete="off"></label><label id="remember-row" hidden><input id="remember-key" type="checkbox"> 記在此 Mac 的 Keychain</label><p class="small muted">每次只傳送本主題教材、全部 Q&A、筆記與新問題。</p><div class="backup-row"><button type="submit" class="primary">保存設定</button><button id="forget-key" type="button" class="plain">清除金鑰</button></div></form><p id="api-status" role="status"></p></dialog>
<dialog id="records-dialog"><div class="dialog-head"><h2>學習紀錄</h2><button class="icon-button" data-close="records-dialog" aria-label="關閉">×</button></div><div class="backup-row"><button id="export-records" class="secondary">匯出 JSON</button><button id="export-md" class="secondary">匯出 MD</button><button id="import-records" class="secondary">匯入 JSON</button><input id="record-picker" type="file" accept=".json" hidden></div><div class="backup-row"><button id="bind-md" class="secondary">連結 MD 檔案</button><button id="show-md" class="plain">查看 MD</button></div><p id="md-status" class="small muted" role="status"></p><p id="record-help" class="small muted">不同裝置各自保存。匯入合併問答、保留筆記衝突。CH3 課程也可匯入原講義的 JSON 備份。</p><textarea id="backup-preview" aria-label="備份文字" placeholder="也可以貼上 JSON 備份"></textarea><button id="merge-pasted" class="primary">合併貼上的紀錄</button><p id="record-status" role="status"></p></dialog>
<dialog id="text-dialog"><div class="dialog-head"><h2 id="text-title"></h2><button class="icon-button" data-close="text-dialog" aria-label="關閉">×</button></div><p id="text-meta" class="small muted"></p><textarea id="text-content" readonly aria-label="內容文字"></textarea><button id="copy-text" class="secondary">複製內容</button></dialog><div id="toast" class="toast" role="status"></div>
<script src="course-core.js"></script><script src="records.js?v=0.1.5"></script><script src="record-sync.js?v=0.1.5"></script><script src="pagination.js?v=0.1.5"></script><script src="platform.js"></script><script src="library.js"></script><script src="katex.min.js"></script><script src="lesson-visuals.js?v=0.1.5"></script><script src="reader.js?v=0.1.7"></script>
</body></html>
